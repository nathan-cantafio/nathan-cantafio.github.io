<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Generated by build.js from blog/posts/$source$. Edit that file, not this one. -->
  <title>$pagetitle$ – Nathan Cantafio</title>
  <meta name="description" content="$metadesc$" />
  <link rel="canonical" href="https://nathancantafio.com/blog/$slug$.html" />
  <link rel="alternate" type="application/rss+xml" title="Nathan Cantafio" href="/feed.xml" />
  <!-- build:head -->
  <!-- /build:head -->
  <link rel="stylesheet" href="/style.css" />
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        tags: 'ams'
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js" async></script>
</head>
<body>

  <div id="header">
    <!-- build:header -->
    <!-- /build:header -->
  </div>

  <div class="page-layout no-sidebar">

    <div class="main-content">
      <a href="/all-posts.html" class="back-link">← Back to all posts</a>
      <header id="post-meta">
        <h1 class="post-title">$title$</h1>
        <p class="post-byline"><time datetime="$date$">$datelong$</time></p>
        <div class="post-abstract">
          $abstract$
        </div>
      </header>
      <article id="post-content">
$body$
      </article>

      <footer class="post-author">
        <img src="/profile.jpeg" alt="" width="800" height="886" loading="lazy">
        <p>Written by <a href="/">Nathan Cantafio</a>. <a href="/all-posts.html" class="more-link">More posts →</a></p>
      </footer>

      <section class="post-subscribe" aria-labelledby="subscribe-heading">
        <h3 id="subscribe-heading">Get new posts by email</h3>
        <p>I'll send you an email when I publish something new. Unsubscribe any time.</p>
        <!-- Kit form: the form ID also appears in sidebar.html -->
        <form class="subscribe-form" action="https://app.kit.com/forms/10118847/subscriptions" method="post">
          <input type="email" name="email_address" placeholder="you@example.com" aria-label="Email address" autocomplete="email" required>
          <button type="submit">Subscribe</button>
        </form>
        <p class="rss-note">Prefer a feed reader? Add <a href="/feed.xml">nathancantafio.com/feed.xml</a> to follow by RSS.</p>
      </section>
    </div>

  </div>

</body>
</html>
