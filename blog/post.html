<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" />
  <title>Redirecting…</title>
  <script>
    // Old post links looked like /blog/post.html?file=some-post.md.
    // Posts now live at /blog/some-post.html, so send old links there.
    var file = new URLSearchParams(location.search).get("file") || "";
    var slug = file.replace(/\.md$/, "");
    location.replace(/^[a-z0-9-]+$/.test(slug) ? "/blog/" + slug + ".html" : "/all-posts.html");
  </script>
</head>
<body>
  <p><a href="/all-posts.html">See all posts</a></p>
</body>
</html>
